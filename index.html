<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Game Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>AI Game Generator</h1>
    <span class="badge">HACKATHON MVP</span>
</header>

<div class="main">
    <div class="sidebar">
        <div class="field">
            <label>Опишите игру на естественном языке</label>
            <textarea id="prompt" placeholder="Например: сделай змейку для бабушки с крупными элементами..."></textarea>
        </div>

        <div class="field">
            <label>Быстрые примеры</label>
            <div class="chips">
                <div class="chip" data-p="сделай змейку для бабушки">🐍 Для бабушки</div>
                <div class="chip" data-p="кликер для детей с яркими цветами">🎨 Кликер для детей</div>
                <div class="chip" data-p="аркада с уклонением">🏃 Аркада</div>
                <div class="chip" data-p="сделай игру посложнее">🔥 Сложная</div>
            </div>
        </div>

        <button class="btn" id="genBtn">⚡ Сгенерировать игру</button>

        <div class="actions">
            <button class="btn btn-secondary" id="harderBtn" disabled>Сложнее</button>
            <button class="btn btn-secondary" id="easierBtn" disabled>Проще</button>
        </div>

        <div class="field">
            <label>Лог генерации</label>
            <div class="log" id="log">> Готов к работе</div>
        </div>

        <div class="field">
            <label>История игр <span id="histCount" style="color:var(--accent)">(0)</span></label>
            <div class="history" id="history"></div>
        </div>
    </div>

    <div class="preview-area">
        <div class="preview-header">
            <div>Playable Result · WebView Preview</div>
            <div class="meta" id="meta"></div>
        </div>
        <div class="iframe-wrapper">
            <div class="placeholder" id="placeholder">
                Опишите игру слева и нажмите <b>Сгенерировать</b>.<br>
                Система проанализирует промпт, определит жанр и аудиторию,<br>
                и создаст готовую HTML5-игру.
            </div>
            <iframe id="frame" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
    </div>
</div>

<script src="js/analyzer.js"></script>
<script src="js/games/snake.js"></script>
<script src="js/games/clicker.js"></script>
<script src="js/games/runner.js"></script>
<script src="js/app.js"></script>
</body>
</html>
